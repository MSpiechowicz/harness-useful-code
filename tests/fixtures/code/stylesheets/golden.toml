# every template kind writes `tile`; no stylesheet that a writer imports holds it, so the uses reach the one
# sheet by name (`?`)
[[symbol]]
query = "src/sass/app.sass::.tile"
note = "html:3 body class, Box.svelte:5 class=, Card.tsx:13 clsx object key, Hero.astro:5 class=, Widget.vue:6 class="
defined = "src/sass/app.sass:36"
used_by = [
  "public/index.html:3 <module>",
  "src/Box.svelte:5 Box",
  "src/Card.tsx:13 Card",
  "src/Hero.astro:5 Hero",
  "src/Widget.vue:6 Widget",
]
uses = ["$brand"]

[[symbol]]
