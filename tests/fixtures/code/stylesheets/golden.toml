# a file `.gitattributes` marks `linguist-generated` is left out and says so
[[symbol]]
query = "generated/bundle.css"
note = "generated/.gitattributes: *.css linguist-generated"

[[impact]]
query = "generated/bundle.css"
note = "the left-out answer, not an empty list"
contains = ["is marked generated by `.gitattributes` and is not in the index"]

# a change to a token reaches the components through the selector that reads it
[[impact]]
query = "$brand"
depth = 3
note = "$brand <- .tile (app.sass:37) <- every file that writes `tile`"
files = ["src/sass/app.sass", "src/Card.tsx", "src/Box.svelte", "src/Hero.astro", "src/Widget.vue", "public/index.html"]
contains = ["Card → .tile"]

[[map]]
note = "the stylesheets of every kind are named; the generated one is not"
files = [
  "src/sass/app.sass",
  "src/tokens/_tokens.sass",
  "src/less/theme.less",
  "src/card.css",
  "src/Panel.module.css",
]
not_files = ["generated/bundle.css"]

# two components that write the same class are no way to each other
[[path]]
from = "Card"
to = "Widget"
note = "both write `tile`; a selector is no way between two components"
text_only = true
contains = ["no chain within 6 hops", "got as far as Card → badge"]
not_contains = [".tile"]

